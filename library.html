<input type="text" id="search" placeholder="Search novel..." onkeyup="searchNovel()">

<div class="card" data-name="future written in blood">
  <h3>Future Written in Blood</h3>
  <a href="reader.html">Read</a>
</div>

<div class="card" data-name="dark ceo love">
  <h3>Dark CEO Love</h3>
  <a href="reader.html">Read</a>
</div>

<script>
function searchNovel(){
  let input = document.getElementById("search").value.toLowerCase();
  let cards = document.querySelectorAll(".card");

  cards.forEach(card => {
    let name = card.getAttribute("data-name");

    if(name.includes(input)){
      card.style.display = "block";
    } else {
      card.style.display = "none";
    }
  });
}
</script>
